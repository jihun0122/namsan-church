<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>남산 중고등부 · 일상과 말씀 OX 퀴즈</title>
<style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#edf2ff;background:#10162a}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:#566bff;color:white;font-weight:750}button:disabled{opacity:.35;cursor:not-allowed}.outline{background:#293451}.wrap{max-width:1450px;margin:auto;padding:25px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(23px,3vw,42px);margin:5px 0}.muted{color:#aebbd5}.layout{display:grid;grid-template-columns:1fr;gap:20px;margin-top:20px}.panel{border-radius:22px;background:#1a2540;padding:24px}.question{min-height:390px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:25px;text-align:center}.tag{background:#344373;border-radius:99px;padding:9px 18px;color:#d5e0ff;font-weight:700}.question h2{font-size:clamp(30px,4vw,60px);line-height:1.35;margin:10px 0;word-break:keep-all}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:14px}.choice{padding:16px;background:#2b395e;border-radius:14px;font-size:clamp(18px,2vw,28px)}.answer{margin-top:16px;border:2px solid #4bd0ac;background:#153c40;padding:20px;border-radius:18px;font-size:22px}.answer strong{color:#9fffe0}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;align-items:center}.controls button{flex:1}.tips{margin-top:15px;line-height:1.65}.progress{height:8px;background:#2b3857;border-radius:10px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:#6e92ff;transition:width .2s}.timer{font-weight:900;font-size:23px;color:#ffdb7d}.footer{margin-top:20px;color:#aebbd5;font-size:14px}kbd{background:#293451;padding:3px 6px;border-radius:4px}@media(max-width:850px){.layout{grid-template-columns:1fr}.wrap{padding:13px}.panel{padding:17px}.question{min-height:300px}.choices{grid-template-columns:1fr}.controls button{flex:auto}.question h2{font-size:clamp(27px,6vw,42px)}}
</style>
</head><body><main class="wrap"><header><div><div class="muted">12문항 · 개인전 · 약 15~20분</div><h1>📖 내 일상과 연결되는 성경 OX 퀴즈</h1></div><div><button class="outline" id="fullBtn">⛶ 전체 화면</button> <button class="outline" id="resetBtn">처음부터</button></div></header><div class="layout"><section class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="tag" id="round"></span><span class="muted" id="count"></span></div><div class="progress"><div id="bar"></div></div><div class="question"><h2 id="question"></h2><div class="choices" id="choices"></div></div><div id="answer" class="answer" hidden></div><div class="controls"><button class="outline" id="prev">← 이전</button><button id="reveal">정답 공개</button><button id="next">다음 →</button></div><div class="controls"><button class="outline" id="timerBtn">⏱ 15초 시작</button><span class="timer" id="timer">00:15</span></div></section></div><div class="footer">진행 방법: 각자 O 또는 X를 선택합니다. 제한 시간이 끝나면 정답과 말씀 해설을 함께 확인하세요. 키보드 ← → 로 문제 이동, 스페이스바로 정답 공개.</div><div class="panel tips" style="margin-top:20px"><strong>마무리 나눔</strong><p>오늘 말씀을 생각하며 이번 주에 바꾸고 싶은 습관 한 가지는 무엇인가요?</p><p class="muted" style="font-size:14px">성경 구절은 의미를 풀어 설명했습니다. 디지털 상황에 관한 문제는 말씀의 원리를 오늘의 생활에 적용한 것입니다.</p></div></main>
<script>
const questions=[
{r:"숏폼·자유",q:"바울은 어떤 일이 허용되는지를 따지는 것 외에도, 그것이 유익한지와 자신을 지배하는지를 따진다.",a:"O",v:"고린도전서 6:12",e:"허용된다고 해서 모두 유익한 것은 아니며, 바울은 어떤 것에도 지배받지 않겠다고 말합니다. 숏폼과 게임도 “해도 되나?”에 더해 “유익한가, 끌려다니는가?”를 물어볼 수 있습니다."},
{r:"AI·팩트체크",q:"베뢰아 사람들은 바울의 말을 기꺼이 받아들였기 때문에, 그 내용이 성경과 맞는지는 따로 확인하지 않았다.",a:"X",v:"사도행전 17:11",e:"그들은 말씀을 간절히 받으면서도 그것이 사실인지 날마다 성경을 살폈습니다. 열린 태도와 내용 검증은 함께 갈 수 있습니다. AI 답변을 검토하는 태도에도 적용할 수 있습니다."},
{r:"SNS·인정",q:"예수님은 선한 행동을 사람들이 보기만 해도 하나님께 받을 상이 없어진다고 가르치셨다.",a:"X",v:"마태복음 6:1–4; 5:16",e:"6장의 경고는 사람에게 보이려는 목적으로 의를 행하는 것에 관한 것입니다. 5장에서는 사람들이 선한 행실을 보고 하나님께 영광을 돌리게 하라고 하십니다. 핵심은 공개 여부만이 아니라 동기와 목적입니다."},
{r:"외모·성경 읽기",q:"하나님은 중심을 보신다는 말씀 직후, 성경은 다윗의 외모도 묘사한다.",a:"O",v:"사무엘상 16:7, 12",e:"16:7은 하나님이 중심을 보신다고 말하고, 16:12는 다윗의 외모를 묘사합니다. 외모를 언급하는 것과 외모를 사람의 가치나 선택 기준으로 삼는 것은 구분해야 합니다."},
{r:"단톡방·분노",q:"성경은 화를 내는 것과 죄를 짓는 것을 구분하면서도, 분노를 오래 품거나 마귀에게 틈을 주지 말라고 경고한다.",a:"O",v:"에베소서 4:26–27",e:"분노라는 감정이 생겼다는 사실만으로 모든 행동이 정당해지지는 않습니다. 단톡방에서 화가 났을 때도 그 감정을 어떻게 다루고 행동하는지가 중요합니다."},
{r:"친구·판단",q:"예수님은 남을 비판하지 말라고 하신 뒤, 자기 눈의 들보를 먼저 빼고 형제의 눈의 티를 빼라고 하셨다.",a:"O",v:"마태복음 7:1–5",e:"본문은 자기 잘못을 외면한 채 남을 정죄하는 태도를 경고합니다. 먼저 자신을 돌아본 뒤 다른 사람을 돕는 순서를 제시합니다."},
{r:"친구·용서",q:"예수님은 하루에 일곱 번 죄를 짓는 형제가 일곱 번 돌아와 회개한다고 말해도 용서하라고 하셨다.",a:"O",v:"누가복음 17:3–4",e:"본문은 반복되는 회개에도 용서하라고 가르칩니다. 동시에 죄를 범하면 경고하라고도 합니다. 용서는 잘못을 없던 일로 만들거나 괴롭힘에서 도움을 구하지 말라는 뜻이 아닙니다."},
{r:"시험·기도",q:"성경에서 염려 대신 기도하라고 권하며 약속한 것은, 내가 요청한 결과가 그대로 이루어지는 것이다.",a:"X",v:"빌립보서 4:6–7",e:"본문이 약속하는 것은 하나님의 평강이 마음과 생각을 지키는 것입니다. 원하는 시험 점수나 결과가 그대로 보장된다는 뜻은 아닙니다."},
{r:"성적·만족",q:"바울이 한 “모든 것을 할 수 있다”는 말의 앞 문맥은, 바울이 풍족함과 배고픔 모두에서 자족하는 법을 배웠다는 내용이다.",a:"O",v:"빌립보서 4:11–13",e:"바울은 낮아짐과 풍부함, 배부름과 배고픔을 말한 뒤 그리스도 안에서 감당할 수 있다고 고백합니다. 원하는 성적이나 성공을 무조건 얻는다는 뜻으로 읽으면 문맥을 놓치게 됩니다."},
{r:"진로·계획",q:"성경은 미래를 알 수 없으므로, 어느 도시에서 무엇을 할지 같은 구체적인 계획 자체를 금지한다.",a:"X",v:"야고보서 4:13–16",e:"경고하는 것은 미래와 생명을 자기 뜻대로 통제할 수 있다는 자만입니다. 주님의 뜻을 인정하며 계획하는 태도를 가르칩니다."},
{r:"소비·돈",q:"바울이 부유한 사람에게 명한 것은, 가진 것을 모두 버려 가난해지는 것이다.",a:"X",v:"디모데전서 6:17–19",e:"본문은 교만하지 말고 재물 대신 하나님께 소망을 두며, 선한 일을 하고 나누기를 좋아하라고 권합니다. 이 구절의 명령을 “모두 버려라”로 바꾸면 정확하지 않습니다."},
{r:"학교·믿음",q:"바울이 젊은 디모데에게 본을 보이라고 한 영역에는, 말과 행실뿐 아니라 성적과 사회적 성공도 포함된다.",a:"X",v:"디모데전서 4:12",e:"본문에 나오는 영역은 말, 행실, 사랑, 믿음, 정절입니다. 성적과 사회적 성공은 이 목록에 없습니다. 믿음의 본을 성취의 크기와 동일시해서는 안 됩니다."}
].map(q=>({...q,r:'OX · '+q.r,c:['O','X']}));
let index=0,shown=false;let remain=15,interval=null;const $=id=>document.getElementById(id);function render(){const q=questions[index];$('round').textContent=q.r;$('count').textContent=`${index+1} / ${questions.length}`;$('bar').style.width=`${(index+1)/questions.length*100}%`;$('question').textContent=q.q;$('choices').replaceChildren(...q.c.map(v=>{const d=document.createElement('div');d.className='choice';d.textContent=v;return d}));$('answer').hidden=!shown;$('answer').innerHTML='';if(shown){const b=document.createElement('strong');b.textContent='정답: '+q.a;const p=document.createElement('p');p.textContent=q.e;const small=document.createElement('small');small.textContent='성경 근거: '+q.v;$('answer').append(b,p,small)}$('reveal').textContent=shown?'정답 숨기기':'정답 공개';$('prev').disabled=index===0;$('next').disabled=index===questions.length-1};function stopTimer(){clearInterval(interval);interval=null};function drawTimer(){$('timer').textContent='00:'+String(remain).padStart(2,'0')};function change(n){index=Math.min(questions.length-1,Math.max(0,index+n));shown=false;stopTimer();remain=15;drawTimer();render()};$('prev').onclick=()=>change(-1);$('next').onclick=()=>change(1);$('reveal').onclick=()=>{shown=!shown;render()};$('timerBtn').onclick=()=>{stopTimer();remain=15;drawTimer();interval=setInterval(()=>{remain--;drawTimer();if(remain<=0){stopTimer();$('timer').textContent='시간 종료!'}},1000)};$('resetBtn').onclick=()=>{if(confirm('첫 문제로 돌아갈까요?')){index=0;shown=false;stopTimer();remain=15;drawTimer();render()}};$('fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')change(1);if(e.key==='ArrowLeft')change(-1);if(e.code==='Space'){e.preventDefault();shown=!shown;render()}});render();drawTimer();
</script></body></html>
