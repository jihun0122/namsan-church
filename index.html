function celebrateAnswer(answer,animateBox=true){
  if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
  if(animateBox){
    void answer.offsetWidth;
    answer.classList.add('answer-celebrate');
  }
  const burst=document.createElement('div');
  burst.className='answer-fireworks';
  burst.setAttribute('aria-hidden','true');
  const colors=['#087747','#d4ad30','#79a754','#edc95b'];
  for(let i=0;i<48;i++){
    const particle=document.createElement('span');
    particle.className='confetti';
    const angle=Math.random()*Math.PI*2;
    const distance=45+Math.random()*135;
    const values={
      '--origin':i%2?'30%':'70%',
      '--color':colors[i%colors.length],
      '--dx':Math.cos(angle)*distance+'px',
      '--dy':Math.sin(angle)*distance+75+'px',
      '--spin':(Math.random()*720-360)+'deg',
      '--delay':Math.random()*.12+'s'
    };
    Object.entries(values).forEach(([key,value])=>particle.style.setProperty(key,value));
    burst.append(particle);
  }
  answer.append(burst);
  setTimeout(()=>{burst.remove();if(animateBox)answer.classList.remove('answer-celebrate')},1500);
}
let choiceTimers=[],choicesReady=true;
function clearChoiceTimers(){choiceTimers.forEach(clearTimeout);choiceTimers=[]}
function finishChoices(){
  const shouldStart=!choicesReady&&!shown;
  clearChoiceTimers();
  document.querySelectorAll('#choices .choice').forEach(choice=>{choice.classList.remove('choice-pending');choice.removeAttribute('aria-hidden')});
  choicesReady=true;
  $('next').textContent=shown?(index===questions.length-1?'수여식으로 →':'다음 문제 →'):'정답 공개 →';
  if(shouldStart)startCountdown();
}
function introduceChoices(){
  clearChoiceTimers();
  choicesReady=shown;
  if(shown)return;
  const choices=[...document.querySelectorAll('#choices .choice')];
  choices.forEach(choice=>{choice.classList.add('choice-pending');choice.setAttribute('aria-hidden','true')});
  $('next').textContent='보기 모두 보기 →';
  choices.forEach((choice,i)=>{
    choiceTimers.push(setTimeout(()=>{
      choice.classList.remove('choice-pending');
      choice.removeAttribute('aria-hidden');
      choice.classList.add('choice-enter');
      if(i===choices.length-1)choiceTimers.push(setTimeout(finishChoices,450));
    },1200+i*650));
  });
}
let awardFireworksInterval=null;
function syncAwardFireworks(){
  const screen=$('awardScreen');
  if(!ended){
    clearInterval(awardFireworksInterval);
    awardFireworksInterval=null;
    screen.querySelectorAll('.answer-fireworks').forEach(burst=>burst.remove());
    screen.classList.remove('answer-celebrate');
    return;
  }
  if(awardFireworksInterval!==null||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
  celebrateAnswer(screen);
  awardFireworksInterval=setInterval(()=>celebrateAnswer(screen,false),1300);
}
