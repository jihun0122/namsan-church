<head>

<title>중고등부 성경 퀴즈 챌린지</title>
<style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#edf2ff;background:#10162a}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:#566bff;color:white;font-weight:750}button:disabled{opacity:.35;cursor:not-allowed}.outline{background:#293451}.wrap{max-width:1450px;margin:auto;padding:25px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(23px,3vw,42px);margin:5px 0}.muted{color:#aebbd5}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:20px}.panel{border-radius:22px;background:#1a2540;padding:24px}.question{min-height:390px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:25px;text-align:center}.tag{background:#344373;border-radius:99px;padding:9px 18px;color:#d5e0ff;font-weight:700}.question h2{font-size:clamp(30px,4vw,60px);line-height:1.35;margin:10px 0;word-break:keep-all}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:14px}.choice{padding:16px;background:#2b395e;border-radius:14px;font-size:clamp(18px,2vw,28px)}.answer{margin-top:16px;border:2px solid #4bd0ac;background:#153c40;padding:20px;border-radius:18px;font-size:22px}.answer strong{color:#9fffe0}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;align-items:center}.controls button{flex:1}.teams{display:grid;gap:12px}.team{border-radius:15px;background:#293451;padding:14px}.team-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:20px}.points{font-size:27px;font-weight:900;color:#ffdb7d}.team button{padding:9px 13px}.scorebuttons{display:flex;gap:8px;justify-content:flex-end}.tips{margin-top:15px;line-height:1.65}.progress{height:8px;background:#2b3857;border-radius:10px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:#6e92ff;transition:width .2s}.timer{font-weight:900;font-size:23px;color:#ffdb7d}.footer{margin-top:20px;color:#aebbd5;font-size:14px}kbd{background:#293451;padding:3px 6px;border-radius:4px}@media(max-width:850px){.layout{grid-template-columns:1fr}.wrap{padding:13px}.panel{padding:17px}.question{min-height:300px}.choices{grid-template-columns:1fr}.controls button{flex:auto}.question h2{font-size:clamp(27px,6vw,42px)}}
</style>
</head><body><main class="wrap"><header><div><div class="muted">20명 · 4팀 · 약 20분</div><h1>📖 중고등부 성경 퀴즈 챌린지</h1></div><div><button class="outline" id="fullBtn">⛶ 전체 화면</button> <button class="outline" id="resetBtn">처음부터</button></div></header><div class="layout"><section class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="tag" id="round"></span><span class="muted" id="count"></span></div><div class="progress"><div id="bar"></div></div><div class="question"><h2 id="question"></h2><div class="choices" id="choices"></div></div><div id="answer" class="answer" hidden></div><div class="controls"><button class="outline" id="prev">← 이전</button><button id="reveal">정답 공개</button><button id="next">다음 →</button></div><div class="controls"><button class="outline" id="timerBtn">⏱ 15초 시작</button><span class="timer" id="timer">00:15</span><button class="outline" id="hideScore">점수판 숨기기</button></div></section><aside id="scoreArea" class="panel"><h2 style="margin-top:0">🏆 실시간 점수판</h2><div class="teams" id="teams"></div><p class="muted tips">OX: 10점 / 객관식·초성: 20점<br>점수는 브라우저에 자동 저장됩니다.</p><button class="outline" id="scoreReset">점수 초기화</button></aside></div><div class="footer">진행 방법: 4팀이 동시에 정답을 제출합니다. 정답을 공개한 후 맞힌 팀의 + 버튼을 눌러 점수를 추가하세요. 키보드 ← → 로 문제 이동, 스페이스바로 정답 공개.</div></main>
<script>
const questions=[
{r:'1라운드 · OX',q:'아담과 하와가 먹은 선악과는 사과였다.',c:['O','X'],a:'X',v:'창세기 3:6',e:'성경에는 어떤 종류의 열매였는지 기록되어 있지 않습니다.',p:10},
{r:'1라운드 · OX',q:'다윗은 골리앗과 싸울 때 사울 왕의 갑옷을 입었다.',c:['O','X'],a:'X',v:'사무엘상 17:38–40',e:'갑옷에 익숙하지 않아 벗고 물매와 돌을 가지고 나갔습니다.',p:10},
{r:'1라운드 · OX',q:'예수님은 물 위를 걸으신 적이 있다.',c:['O','X'],a:'O',v:'마태복음 14:25',e:'예수님께서는 바다 위를 걸어 제자들에게 오셨습니다.',p:10},
{r:'1라운드 · OX',q:'노아의 방주에는 노아를 포함해 모두 여덟 명이 들어갔다.',c:['O','X'],a:'O',v:'베드로전서 3:20',e:'노아와 그의 아내, 세 아들과 세 며느리까지 여덟 명입니다.',p:10},
{r:'1라운드 · OX',q:'요나는 큰 물고기 뱃속에서 7일 동안 있었다.',c:['O','X'],a:'X',v:'요나 1:17',e:'요나는 사흘 밤낮을 물고기 뱃속에 있었습니다.',p:10},
{r:'2라운드 · 객관식',q:'예수님께서 물을 포도주로 바꾸신 장소는?',c:['① 베들레헴','② 가나','③ 여리고','④ 가버나움'],a:'② 가나',v:'요한복음 2:1–11',e:'갈릴리 가나의 혼인 잔치에서 일어난 표적입니다.',p:20},
{r:'2라운드 · 객관식',q:'여리고 성을 돌 때 일곱째 날에는 성을 몇 바퀴 돌았을까요?',c:['① 3바퀴','② 5바퀴','③ 7바퀴','④ 12바퀴'],a:'③ 7바퀴',v:'여호수아 6:15',e:'일곱째 날에는 일곱 번 성을 돌았습니다.',p:20},
{r:'2라운드 · 객관식',q:'오병이어 기적에 사용된 떡과 물고기는?',c:['① 떡 3개·물고기 2마리','② 떡 5개·물고기 2마리','③ 떡 7개·물고기 3마리','④ 떡 5개·물고기 5마리'],a:'② 떡 5개·물고기 2마리',v:'요한복음 6:9',e:'보리떡 다섯 개와 물고기 두 마리였습니다.',p:20},
{r:'2라운드 · 객관식',q:'예수님을 보기 위해 나무에 올라간 사람은?',c:['① 니고데모','② 바디매오','③ 삭개오','④ 나사로'],a:'③ 삭개오',v:'누가복음 19:2–4',e:'삭개오는 예수님을 보려고 돌무화과나무에 올라갔습니다.',p:20},
{r:'2라운드 · 객관식',q:'하나님께 지혜를 구한 이스라엘 왕은?',c:['① 사울','② 다윗','③ 솔로몬','④ 르호보암'],a:'③ 솔로몬',v:'열왕기상 3:9–12',e:'솔로몬은 백성을 재판할 지혜를 구했습니다.',p:20},
{r:'3라운드 · 초성',q:'ㅁ ㅅ',c:[],a:'모세',v:'출애굽기 3장',e:'하나님께서 이스라엘을 이끌도록 부르신 인물입니다.',p:20},
{r:'3라운드 · 초성',q:'ㅇ ㅂ ㄹ ㅎ',c:[],a:'아브라함',v:'창세기 17:5',e:'하나님이 많은 민족의 아버지가 되게 하겠다고 하셨습니다.',p:20},
{r:'3라운드 · 초성',q:'ㄱ ㄹ ㅇ',c:[],a:'골리앗',v:'사무엘상 17장',e:'다윗과 맞선 블레셋의 장수입니다.',p:20},
{r:'3라운드 · 초성',q:'ㄷ ㄴ ㅇ',c:[],a:'다니엘',v:'다니엘 6장',e:'사자굴에 던져졌던 믿음의 인물입니다.',p:20},
{r:'3라운드 · 초성',q:'ㅂ ㄷ ㄹ',c:[],a:'베드로',v:'마태복음 14:28–31',e:'예수님의 부르심에 물 위를 걸었던 제자입니다.',p:20}
];
let index=0,shown=false;let scores;try{scores=JSON.parse(localStorage.getItem('bibleQuizScores'))}catch(e){}if(!Array.isArray(scores)||scores.length!==4)scores=[0,0,0,0];let remain=15,interval=null;const $=id=>document.getElementById(id);function render(){const q=questions[index];$('round').textContent=q.r;$('count').textContent=`${index+1} / ${questions.length}`;$('bar').style.width=`${(index+1)/questions.length*100}%`;$('question').textContent=q.q;$('choices').replaceChildren(...q.c.map(v=>{const d=document.createElement('div');d.className='choice';d.textContent=v;return d}));$('answer').hidden=!shown;$('answer').innerHTML='';if(shown){const b=document.createElement('strong');b.textContent='정답: '+q.a;const p=document.createElement('p');p.textContent=q.e;const small=document.createElement('small');small.textContent='성경 근거: '+q.v;$('answer').append(b,p,small)}$('reveal').textContent=shown?'정답 숨기기':'정답 공개';$('prev').disabled=index===0;$('next').disabled=index===questions.length-1;renderScores()};function renderScores(){$('teams').replaceChildren(...scores.map((v,i)=>{const d=document.createElement('div');d.className='team';const top=document.createElement('div');top.className='team-top';const name=document.createElement('strong');name.textContent=`${i+1}팀`;const value=document.createElement('span');value.className='points';value.textContent=v+'점';top.append(name,value);const buttons=document.createElement('div');buttons.className='scorebuttons';[[-20,'−20'],[-10,'−10'],[10,'+10'],[20,'+20']].forEach(([n,label])=>{const b=document.createElement('button');b.textContent=label;b.className=n<0?'outline':'';b.onclick=()=>{scores[i]=Math.max(0,scores[i]+n);localStorage.setItem('bibleQuizScores',JSON.stringify(scores));renderScores()};buttons.append(b)});d.append(top,buttons);return d}))};function stopTimer(){clearInterval(interval);interval=null};function drawTimer(){$('timer').textContent='00:'+String(remain).padStart(2,'0')};function change(n){index=Math.min(questions.length-1,Math.max(0,index+n));shown=false;stopTimer();remain=15;drawTimer();render()};$('prev').onclick=()=>change(-1);$('next').onclick=()=>change(1);$('reveal').onclick=()=>{shown=!shown;render()};$('timerBtn').onclick=()=>{stopTimer();remain=15;drawTimer();interval=setInterval(()=>{remain--;drawTimer();if(remain<=0){stopTimer();$('timer').textContent='시간 종료!'}},1000)};$('scoreReset').onclick=()=>{if(confirm('모든 팀 점수를 초기화할까요?')){scores=[0,0,0,0];localStorage.setItem('bibleQuizScores',JSON.stringify(scores));renderScores()}};$('resetBtn').onclick=()=>{if(confirm('첫 문제로 돌아갈까요? (점수는 유지됩니다)')){index=0;shown=false;stopTimer();remain=15;drawTimer();render()}};$('fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};$('hideScore').onclick=()=>{const x=$('scoreArea');x.hidden=!x.hidden;$('hideScore').textContent=x.hidden?'점수판 보이기':'점수판 숨기기';document.querySelector('.layout').style.gridTemplateColumns=x.hidden?'1fr':''};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')change(1);if(e.key==='ArrowLeft')change(-1);if(e.code==='Space'){e.preventDefault();shown=!shown;render()}});render();drawTimer();
</script></body></html>
